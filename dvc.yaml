stages:
  data_ingestion:
    cmd: "python -m mlflow_project.pipeline.stage_01_data_ingestion"
    deps:
      - src/mlflow_project/pipeline/stage_01_data_ingestion.py
      - src/mlflow_project/components/data_ingestion.py
      - config/config.yaml
    outs:
      - artifacts/data_ingestion/ingested_data

  data_validation:
    cmd: "python -m mlflow_project.pipeline.stage_02_data_validation"
    deps:
      - src/mlflow_project/pipeline/stage_02_data_validation.py
      - src/mlflow_project/components/data_validation.py
      - config/config.yaml
      - config/schema.yaml
      - artifacts/data_ingestion/ingested_data/bss_data.csv
    outs:
      - artifacts/data_validation/status.txt
  
  data_preprocessing:
    cmd: python -m mlflow_project.pipeline.stage_03_data_preprocessing
    deps:
      - src/mlflow_project/pipeline/stage_03_data_preprocessing.py
      - src/mlflow_project/components/data_preprocessing.py
      - config/config.yaml
      - artifacts/data_ingestion/ingested_data
    outs:
      - artifacts/data_preprocessing/preprocessed_data.csv
  
  data_feature_engineering:
    cmd: python -m mlflow_project.pipeline.stage_04_feature_engineering
    deps:
      - src/mlflow_project/pipeline/stage_04_feature_engineering.py
      - src/mlflow_project/components/feature_engineering.py
      - config/config.yaml
    outs:
      - artifacts/feature_engineering/feature_engineered_data.csv

  model_trainer:
    cmd: python -m mlflow_project.pipeline.stage_05_model_trainer
    deps:
      - src/mlflow_project/pipeline/stage_05_model_trainer.py
      - src/mlflow_project/components/model_trainer.py
      - config/config.yaml
      - artifacts/feature_engineering/feature_engineered_data.csv
    outs:
      - artifacts/model_trainer/model.joblib
      - artifacts/model_trainer/scaler.joblib

  model_evaluation:
    cmd: python -m mlflow_project.pipeline.stage_06_model_evaluation
    deps:
      - src/mlflow_project/pipeline/stage_06_model_evaluation.py
      - src/mlflow_project/components/model_evaluation.py
      - config/config.yaml
      - artifacts/model_trainer/model.joblib
      - artifacts/model_trainer/scaler.joblib
      - artifacts/feature_engineering/feature_engineered_data.csv
    outs:
      - artifacts/model_evaluation/metrics.json
