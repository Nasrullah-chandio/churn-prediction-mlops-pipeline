
artifacts_root: artifacts
data_ingestion:
  root_dir: artifacts/data_ingestion
  bss_data_path: data/raw-data/bss_data.csv
  network_data_path: data/raw-data/network_data.csv
  complaints_data_path: data/raw-data/complaints_data.csv
  ingested_dir: artifacts/data_ingestion/ingested_data

data_validation:
  root_dir: artifacts/data_validation
  data_path: artifacts/data_ingestion/ingested_data/bss_data.csv
  status_file: artifacts/data_validation/status.txt

schema: config/schema.yaml

data_preprocessing:
  root_dir: artifacts/data_preprocessing
  bss_data_path: artifacts/data_ingestion/ingested_data/bss_data.csv
  network_data_path: artifacts/data_ingestion/ingested_data/network_data.csv
  complaints_data_path: artifacts/data_ingestion/ingested_data/complaints_data.csv
